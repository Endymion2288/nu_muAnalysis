version: 1
stage: 22
architectures: [bdt]
feature_version: F5
seeds: [20261029, 20261030, 20261031]
modes:
  UU: {train: unit, monitor: unit}
  FU: {train: flat, monitor: unit}
fixed_trials:
  bdt: {max_depth: 7, rounds: 1200}
bdt_rounds_override: 4800
