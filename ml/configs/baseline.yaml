units:
  ML_mu_p_GeV:
    unit: GeV
    role: feature
    expression: SafeAt(Track_p0, LeadTrack_Idx) / 1000.0
  ML_mu_px0_GeV:
    unit: GeV
    role: feature
    expression: SafeAt(Track_px0, LeadTrack_Idx) / 1000.0
  ML_mu_py0_GeV:
    unit: GeV
    role: feature
    expression: SafeAt(Track_py0, LeadTrack_Idx) / 1000.0
  ML_mu_pz0_GeV:
    unit: GeV
    role: feature
    expression: SafeAt(Track_pz0, LeadTrack_Idx) / 1000.0
  ML_mu_x0_mm:
    unit: mm
    role: feature
    expression: SafeAt(Track_x0, LeadTrack_Idx)
  ML_mu_y0_mm:
    unit: mm
    role: feature
    expression: SafeAt(Track_y0, LeadTrack_Idx)
  ML_mu_z0_mm:
    unit: mm
    role: feature
    expression: SafeAt(Track_z0, LeadTrack_Idx)
  ML_mu_X_atVetoNu_mm:
    unit: mm
    role: feature
    expression: SafeAt(Track_X_atVetoNu, LeadTrack_Idx)
  ML_mu_Y_atVetoNu_mm:
    unit: mm
    role: feature
    expression: SafeAt(Track_Y_atVetoNu, LeadTrack_Idx)
  ML_mu_X_atCalo_mm:
    unit: mm
    role: feature
    expression: SafeAt(Track_X_atCalo, LeadTrack_Idx)
  ML_mu_Y_atCalo_mm:
    unit: mm
    role: feature
    expression: SafeAt(Track_Y_atCalo, LeadTrack_Idx)
  ML_sp_mean_x_mm:
    unit: mm
    role: feature
    expression: 'SpacePoint_x.empty() ? std::numeric_limits<double>::quiet_NaN() :
      double(ROOT::VecOps::Mean(SpacePoint_x))'
  ML_sp_rms_x_mm:
    unit: mm
    role: feature
    expression: 'SpacePoint_x.empty() ? std::numeric_limits<double>::quiet_NaN() :
      std::sqrt(std::max(0.0, double(ROOT::VecOps::Mean(SpacePoint_x*SpacePoint_x))
      - ML_sp_mean_x_mm*ML_sp_mean_x_mm))'
  ML_sp_mean_y_mm:
    unit: mm
    role: feature
    expression: 'SpacePoint_y.empty() ? std::numeric_limits<double>::quiet_NaN() :
      double(ROOT::VecOps::Mean(SpacePoint_y))'
  ML_sp_rms_y_mm:
    unit: mm
    role: feature
    expression: 'SpacePoint_y.empty() ? std::numeric_limits<double>::quiet_NaN() :
      std::sqrt(std::max(0.0, double(ROOT::VecOps::Mean(SpacePoint_y*SpacePoint_y))
      - ML_sp_mean_y_mm*ML_sp_mean_y_mm))'
  ML_truth_E_GeV:
    unit: GeV
    role: label
    expression: std::sqrt(std::pow(SafeAt(truth_px,0),2) + std::pow(SafeAt(truth_py,0),2)
      + std::pow(SafeAt(truth_pz,0),2) + std::pow(SafeAt(truth_m,0),2)) / 1000.0
  ML_truth_pdg:
    unit: dimensionless
    role: diagnostic
    expression: SafeAt(truth_pdg,0)
  ML_truth_barcode:
    unit: dimensionless
    role: diagnostic
    expression: SafeAt(truth_barcode,0)
  ML_truth_P_MeV:
    unit: MeV
    role: diagnostic
    expression: SafeAt(truth_P,0)
  ML_truth_m_MeV:
    unit: MeV
    role: diagnostic
    expression: SafeAt(truth_m,0)
  ML_truth_px_MeV:
    unit: MeV
    role: diagnostic
    expression: SafeAt(truth_px,0)
  ML_truth_py_MeV:
    unit: MeV
    role: diagnostic
    expression: SafeAt(truth_py,0)
  ML_truth_pz_MeV:
    unit: MeV
    role: diagnostic
    expression: SafeAt(truth_pz,0)
  ML_calo0_E_EM_GeV:
    unit: GeV (EM scale)
    role: feature
    expression: Calo0_E_EM / 1000.0
  ML_calo1_E_EM_GeV:
    unit: GeV (EM scale)
