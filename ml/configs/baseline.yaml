partition:
  fractions:
    train: 0.6
    validation: 0.15
    calibration: 0.1
    test: 0.15
  group: same component and RDO generation range across both periods; SIBYLL challenge
    only
energy_edges_GeV:
- 100
- 200
- 400
- 800
- 1600
- 3200
- 6400
weight_mode: unit diagnostic; physical flux normalization not verified
loss: squared error in log(E/GeV), plus residual log(E/p)
xgboost:
  n_estimators: 600
  max_depth: 3
  learning_rate: 0.04
  subsample: 0.8
  colsample_bytree: 1.0
  min_child_weight: 20
  reg_lambda: 10
  tree_method: hist
  early_stopping_rounds: 40
  n_jobs: 1
bootstrap_replicates: 500
test_policy: development reports use validation only; calibration and test unopened
  for model selection
limitations:
- shape means and widths are global SpacePoint summaries, not station topology
- no CaloNu or dual-gain data calibration in this stage
- no Track_hitSet or Track_nMeasurements indexing
- unit weights cannot establish physical flux averaged performance
